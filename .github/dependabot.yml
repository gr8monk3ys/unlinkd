# Dependabot retune 2026-09-10: this repo is deployed, so version updates stay on,
# but monthly with a small PR cap. Security updates are a repo setting and unaffected.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  ignore:
  - dependency-name: gr8monk3ys/*
  open-pull-requests-limit: 3
